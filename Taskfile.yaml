version: "3"

silent: true

vars:
  PYTHON: '{{.PYTHON | default "python3"}}'
  DISC: disc/SCES01000.CUE
  # Optional retail BIOS dump; without it the runtime boots the bundled OpenBIOS
  BIOS: '{{.BIOS | default ""}}'
  DEBUG_PORT: 4370
  BEETLE_PORT: 4380
  # Prefix for headless runs, e.g. RUNNER="xvfb-run -a"
  RUNNER: '{{.RUNNER | default ""}}'
  # musl lacks getcontext/makecontext/swapcontext (psx_fiber.c), see CLAUDE.md
  CMAKE_FLAGS: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release
    -DPSX_PYTHON="$(command -v {{.PYTHON}})"
  # Player build: public channel, no debug server, OpenBIOS only, version from VERSION
  RELEASE_FLAGS: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DPSX_RELEASE_CHANNEL=public
    -DPSX_GAME_VERSION=$(cat VERSION) -DPSXRECOMP_BIOS_STEMS=OpenBIOS

tasks:
  emitters:
    desc: Build the recompiler emitters into build-recompiler/
    cmds:
      - ./psxrecomp/tools/ci/build_emitters.sh

  generate:
    desc: Recompile BIOS and game into generated/ (the CLI writes the BIOS stamp)
    vars:
      # Without a retail dump only the bundled OpenBIOS is regenerated
      BIOS_ARG:
        sh: '[ -n "{{.BIOS}}" ] && [ -f "{{.BIOS}}" ] && echo "--bios {{.BIOS}}" || true'
    cmds:
      # Without --no-toolchain-download the CLI fetches a glibc toolchain and edits shell rc files.
      # After a framework update: task generate -- --force-bios (an existing BIOS backend is kept otherwise).
      - >-
        {{.PYTHON}} psxrecomp/psxrecomp_cli.py generate --config game.toml --project-root .
        --disc {{.DISC}} {{.BIOS_ARG}} --no-toolchain-download {{.CLI_ARGS}}

  boxart:
    desc: Fetch the original PAL cover for the launcher (local only, never commit), then reconfigure
    cmds:
      # Copyrighted cover: stays in the gitignored original/ folder, CMake falls back to our own art without it.
      - >-
        {{.PYTHON}} -I psxrecomp/tools/new_project_layout/fetch_boxart.py
        --name "Kula World (Europe)" --out assets/launcher/original/boxart.tga

  launcher-art:
    desc: Render the launcher box art, brand mark and app icon from assets/launcher/*.svg (ImageMagick + librsvg)
    dir: assets/launcher
    cmds:
      - magick -background none boxart.svg -depth 8 -compress RLE boxart.tga
      - magick -background none brand.svg -depth 8 -compress RLE brand.tga
      - magick -background none -density 96 icon.svg -resize 256x256 -gravity center -extent 256x256 -depth 8 -define icon:auto-resize=256,128,64,48,32,16 kula.ico
      # psxrecomp stages psxrecomp.png from APP_ICON's folder as the SDL window icon (launcher and game)
      - magick -background none -density 192 icon.svg -resize 512x512 -gravity center -extent 512x512 -depth 8 psxrecomp.png
      # macOS .app icon (Dock, Cmd+Tab); ImageMagick cannot write icns, make_icns.py packs the PNGs
      - >-
        d=$(mktemp -d) && for s in 16 32 128 256 512 1024; do
        magick -background none -density $(( s < 192 ? 72 : s * 96 / 256 )) icon.svg -resize ${s}x${s}
        -gravity center -extent ${s}x${s} -depth 8 PNG32:$d/$s.png; done
        && {{.PYTHON}} -I ../../tools/make_icns.py kula.icns $d/16.png $d/32.png $d/128.png $d/256.png $d/512.png $d/1024.png;
        rc=$?; rm -rf $d; exit $rc

  build:
    desc: Release build without debug server (build-release/)
    cmds:
      - cmake -S . -B build-release {{.CMAKE_FLAGS}}
      - cmake --build build-release

  build:dev:
    desc: Release build with debug server for tests (build-dev/)
    cmds:
      - cmake -S . -B build-dev {{.CMAKE_FLAGS}} -DPSX_DEBUG_TOOLS=ON
      - cmake --build build-dev

  build:win:
    desc: Windows x64 cross build with MinGW-w64, OpenBIOS only, debug server on (build-win/)
    cmds:
      - >-
        cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=psxrecomp/cmake/toolchain-mingw-w64.cmake
        -DPSXRECOMP_BIOS_STEMS=OpenBIOS -DPSX_DEBUG_TOOLS=ON
      - cmake --build build-win

  run:win:
    desc: Start the Windows build under Wine (headless with RUNNER="xvfb-run -a"), launcher unless CLI_ARGS say otherwise
    vars:
      WINEPREFIX: '{{.WINEPREFIX | default ".wine-kula"}}'
    cmds:
      - >-
        WINEPREFIX="$PWD/{{.WINEPREFIX}}" WINEDEBUG=-all
        {{.RUNNER}} wine build-win/Kula_World_Rerolled.exe --disc {{.DISC}} {{.CLI_ARGS}}

  release:linux:
    desc: Linux x64 release zip, built on glibc in Docker (local daemon) -> dist/
    env:
      # A remote docker context would build elsewhere and see no checkout
      DOCKER_CONTEXT: default
    cmds:
      - docker build -q -t kula-release-linux packaging/linux
      - >-
        docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src kula-release-linux
        sh -c 'cmake -S . -B build-release-linux {{.RELEASE_FLAGS}} -DPSX_PYTHON=/usr/bin/python3
        && cmake --build build-release-linux'
      - scripts/package_release.sh build-release-linux Linux-x64

  release:win:
    desc: Windows x64 release zip, MinGW-w64 cross build -> dist/
    cmds:
      - >-
        cmake -S . -B build-release-win {{.RELEASE_FLAGS}}
        -DCMAKE_TOOLCHAIN_FILE=psxrecomp/cmake/toolchain-mingw-w64.cmake
      - cmake --build build-release-win
      - scripts/package_release.sh build-release-win Windows-x64

  release:mac:
    desc: macOS arm64 release zip with .app and icon (run on the Mac) -> dist/
    cmds:
      - cmake -S . -B build-release-mac {{.RELEASE_FLAGS}} -DPSX_PYTHON="$(command -v {{.PYTHON}})"
      - cmake --build build-release-mac
      - scripts/package_release_macos.sh build-release-mac

  all:
    desc: Emitters, generate and dev build from a fresh checkout
    cmds:
      - task: emitters
      - task: generate
      - task: build:dev

  run:
    desc: Start the release build with launcher
    cmds:
      - '{{.RUNNER}} ./build-release/Kula_World_Rerolled'

  run:dev:
    desc: Start the dev build without launcher, debug server on DEBUG_PORT
    cmds:
      - >-
        {{.RUNNER}} ./build-dev/Kula_World_Rerolled --no-launcher
        {{if .BIOS}}--bios {{.BIOS}} {{end}}--disc {{.DISC}} --debug-port {{.DEBUG_PORT}}

  beetle:
    desc: Start the psx-beetle oracle, debug server on BEETLE_PORT (BIOS=<dump> required)
    requires:
      vars: [BIOS]
    cmds:
      - >-
        SDL_RENDER_DRIVER=software {{.RUNNER}}
        ./psxrecomp/runtime/build-beetle/psx-beetle {{.BIOS}}
        --disc {{.DISC}} --port {{.BEETLE_PORT}}

  smoke:
    desc: Boot smoke test against a running backend (PORT=4370 runtime, 4380 beetle)
    cmds:
      - '{{.PYTHON}} tools/smoke_boot.py --port {{.PORT | default .DEBUG_PORT}} {{.CLI_ARGS}}'

  freeze-timer:
    desc: Keep the level timer full on a running dev build (PORT=4370)
    cmds:
      - '{{.PYTHON}} tools/freeze_timer.py --port {{.PORT | default .DEBUG_PORT}}'

  test:
    desc: Unit tests (Python and C)
    cmds:
      - '{{.PYTHON}} -m unittest discover -s tests'
      - mkdir -p build-tests
      - cc -std=c99 -Wall -Wextra -Werror -Imods/src -o build-tests/test_level_select_logic tests/test_level_select_logic.c mods/src/level_select_logic.c
      - ./build-tests/test_level_select_logic
      - cc -std=c99 -Wall -Wextra -Werror -Imods/src -o build-tests/test_widescreen_logic tests/test_widescreen_logic.c mods/src/widescreen_logic.c
      - ./build-tests/test_widescreen_logic
      - cc -std=c99 -Wall -Wextra -Werror -Imods/src -o build-tests/test_hd_textures_logic tests/test_hd_textures_logic.c mods/src/hd_textures_logic.c
      - ./build-tests/test_hd_textures_logic
      - cc -std=c99 -Wall -Wextra -Werror -Imods/src -o build-tests/test_detail_distance_logic tests/test_detail_distance_logic.c mods/src/detail_distance_logic.c
      - ./build-tests/test_detail_distance_logic
      - cc -std=c99 -Wall -Wextra -Werror -Ipsxrecomp/runtime/include -o build-tests/test_ws_feedback_rect psxrecomp/runtime/tests/test_ws_feedback_rect.c
      - ./build-tests/test_ws_feedback_rect

  lint:
    desc: ruff and black on project Python
    cmds:
      - ruff check tools/smoke_boot.py tools/check_level_select.py tools/find_ws_cull_sites.py tools/freeze_timer.py tools/hd tests
      - black --check tools/smoke_boot.py tools/check_level_select.py tools/find_ws_cull_sites.py tools/freeze_timer.py tools/hd tests

  hd:venv:
    desc: Dev venv for the HD pack builder (Pillow, xxhash)
    cmds:
      - '{{.PYTHON}} -m venv .venv-hd'
      - .venv-hd/bin/pip install -q -r tools/hd/requirements.txt

  hd:build:
    desc: Build the HD texture pack from the disc (Lanczos)
    cmds:
      - .venv-hd/bin/python -I tools/hd/build_pack.py {{.DISC}} hd-work --install build-dev/mods/texture-packs/SCES-01000

  hd:auto:
    desc: Background build like the launcher, args after -- (e.g. --with-model, --python PY)
    cmds:
      - '{{.PYTHON}} -I tools/hd/hd_auto.py --disc {{.DISC}} --pack build-dev/mods/texture-packs/SCES-01000 --data hd-auto {{.CLI_ARGS}}'

  hd:lock:
    desc: Re-pin the runner's packages with hashes per platform (needs uv)
    cmds:
      - '{{.PYTHON}} tools/hd/lock.py'

  hd:verify:
    desc: Compare the HD pack against runtime dumps, DUMPS=<dir>
    cmds:
      - .venv-hd/bin/python -I tools/hd/verify_pack.py build-dev/mods/texture-packs/SCES-01000 {{.DUMPS}}
