version: "3"

silent: true

vars:
  PYTHON: '{{.PYTHON | default "python3"}}'
  DISC: disc/SCES01000.CUE
  BIOS: bios/SCPH1001.BIN
  DEBUG_PORT: 4370
  BEETLE_PORT: 4380
  # Prefix for headless runs, e.g. RUNNER="xvfb-run -a"
  RUNNER: '{{.RUNNER | default ""}}'
  # musl lacks getcontext/makecontext/swapcontext (psx_fiber.c), see CLAUDE.md
  CMAKE_FLAGS: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release
    -DPSX_PYTHON="$(command -v {{.PYTHON}})"

tasks:
  emitters:
    desc: Build the recompiler emitters into build-recompiler/
    cmds:
      - ./psxrecomp/tools/ci/build_emitters.sh

  generate:
    desc: Recompile BIOS and game into generated/ (the CLI writes the BIOS stamp)
    vars:
      # Without a retail dump only the bundled OpenBIOS is regenerated
      BIOS_ARG:
        sh: '[ -f {{.BIOS}} ] && echo "--bios {{.BIOS}}" || true'
    cmds:
      # Without --no-toolchain-download the CLI fetches a glibc toolchain and edits shell rc files.
      # After a framework update: task generate -- --force-bios (an existing BIOS backend is kept otherwise).
      - >-
        {{.PYTHON}} psxrecomp/psxrecomp_cli.py generate --config game.toml --project-root .
        --disc {{.DISC}} {{.BIOS_ARG}} --no-toolchain-download {{.CLI_ARGS}}

  launcher-art:
    desc: Render the launcher box art, brand mark and app icon from assets/launcher/*.svg (ImageMagick + librsvg)
    dir: assets/launcher
    cmds:
      - magick -background none boxart.svg -depth 8 -compress RLE boxart.tga
      - magick -background none brand.svg -depth 8 -compress RLE brand.tga
      - magick -background none -density 96 icon.svg -resize 256x256 -gravity center -extent 256x256 -depth 8 -define icon:auto-resize=256,128,64,48,32,16 kula.ico

  build:
    desc: Release build without debug server (build-release/)
    cmds:
      - cmake -S . -B build-release {{.CMAKE_FLAGS}}
      - cmake --build build-release

  build:dev:
    desc: Release build with debug server for tests (build-dev/)
    cmds:
      - cmake -S . -B build-dev {{.CMAKE_FLAGS}} -DPSX_DEBUG_TOOLS=ON
      - cmake --build build-dev

  all:
    desc: Emitters, generate and dev build from a fresh checkout
    cmds:
      - task: emitters
      - task: generate
      - task: build:dev

  run:
    desc: Start the release build with launcher
    cmds:
      - '{{.RUNNER}} ./build-release/Kula_World_Recompiled'

  run:dev:
    desc: Start the dev build without launcher, debug server on DEBUG_PORT
    cmds:
      - >-
        {{.RUNNER}} ./build-dev/Kula_World_Recompiled --no-launcher
        --bios {{.BIOS}} --disc {{.DISC}} --debug-port {{.DEBUG_PORT}}

  beetle:
    desc: Start the psx-beetle oracle, debug server on BEETLE_PORT
    cmds:
      - >-
        SDL_RENDER_DRIVER=software {{.RUNNER}}
        ./psxrecomp/runtime/build-beetle/psx-beetle bios/beetle/SCPH1001.BIN
        --disc {{.DISC}} --port {{.BEETLE_PORT}}

  smoke:
    desc: Boot smoke test against a running backend (PORT=4370 runtime, 4380 beetle)
    cmds:
      - '{{.PYTHON}} tools/smoke_boot.py --port {{.PORT | default .DEBUG_PORT}} {{.CLI_ARGS}}'

  freeze-timer:
    desc: Keep the level timer full on a running dev build (PORT=4370)
    cmds:
      - '{{.PYTHON}} tools/freeze_timer.py --port {{.PORT | default .DEBUG_PORT}}'

  test:
    desc: Unit tests (Python and C)
    cmds:
      - '{{.PYTHON}} -m unittest discover -s tests'
      - mkdir -p build-tests
      - cc -std=c99 -Wall -Wextra -Werror -Imods/src -o build-tests/test_level_select_logic tests/test_level_select_logic.c mods/src/level_select_logic.c
      - ./build-tests/test_level_select_logic
      - cc -std=c99 -Wall -Wextra -Werror -Imods/src -o build-tests/test_widescreen_logic tests/test_widescreen_logic.c mods/src/widescreen_logic.c
      - ./build-tests/test_widescreen_logic
      - cc -std=c99 -Wall -Wextra -Werror -Ipsxrecomp/runtime/include -o build-tests/test_ws_feedback_rect psxrecomp/runtime/tests/test_ws_feedback_rect.c
      - ./build-tests/test_ws_feedback_rect

  lint:
    desc: ruff and black on project Python
    cmds:
      - ruff check tools/smoke_boot.py tools/check_level_select.py tools/find_ws_cull_sites.py tools/freeze_timer.py tests
      - black --check tools/smoke_boot.py tools/check_level_select.py tools/find_ws_cull_sites.py tools/freeze_timer.py tests
