strict = true
# Kula level-select mod hooks (mods/src/kula_level_select.c): SinglePlayerMenu, HighScoreUi
mod_function_entry_funcs = ["0x000491a8", "0x0004c09c"]

[runtime]
window_title = "Kula World Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "digital"
# Persisted by the recomp-ui launcher on every start; kept here so launches leave no diff
multitap_analog = true

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "8cc747a424dd4cb8fb0959db3dcb51ea51c1807d5c30cf5199201972ff5a678b"

# Widescreen mod (mods/src/kula_widescreen.c). Inert at 4:3 (x_margin 0).
