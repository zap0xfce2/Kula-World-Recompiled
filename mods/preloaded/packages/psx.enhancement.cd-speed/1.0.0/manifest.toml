format_version = 5
id = "psx.enhancement.cd-speed"
version = "1.0.0"
name = "CD Speed"
author = "psxrecomp"
description = "Emulated CD drive speed. Shortens loads without speeding the game up, so it does not disturb movement or timing-based routes."
resolver = "declarative"
save_compatibility = "shared"

# Kula World override of the framework builtin (same id and version), only to
# turn 2x on by default. 4x hangs a world load that starts past level 1 (level
# select, Load Game at a save point): the level never initialises. 2x and 1x
# load it. Instant crashes this title (DISPATCH FATAL).
# Keep in sync with psxrecomp/mods/builtin/packages/psx.enhancement.cd-speed.
[[target]]
game_id = "*"

[[feature]]
id = "cd-speed"
name = "CD Speed"
description = "Enabled by default at 2x for Kula World (4x hangs some world loads). Divides the emulated sector delay, so the drive delivers data sooner while the game itself keeps running at normal speed. Unlike host pacing this changes WHEN the game receives CD interrupts, so a high value can expose timing bugs -- raise it gradually and back off if a load stalls. FMV and CD audio always keep authentic timing."
group = "Quality of Life"
default_enabled = true

[[option]]
feature = "cd-speed"
id = "multiplier"
label = "CD speed multiplier"
description = "1 is authentic 1x. Try 2-32; higher is faster but likelier to trip a timing bug. Any positive value is accepted so you can find this game's limit. Ignored while Instant is ticked."
group = "Quality of Life"
type = "integer"
min = 1
max = 1024
step = 1
default = 2
disabled_by = "instant"

[[option]]
feature = "cd-speed"
id = "instant"
label = "Instant (bounded scheduler)"
description = "Deliver sectors as fast as the bounded instant scheduler allows instead of using a multiplier. Crashes Kula World after the menu; do not use."
group = "Quality of Life"
type = "boolean"
default = "false"

[[option]]
feature = "cd-speed"
id = "instant_budget"
label = "Instant sectors per frame"
description = "How many sectors the instant scheduler may deliver per frame. Lower is gentler on games that dislike bursts. Only used while Instant is ticked."
group = "Quality of Life"
type = "integer"
min = 1
max = 256
step = 1
default = 32

[[plugin]]
feature = "cd-speed"
id = "psx.cd-speed"
